    if(d){const p=d.split('-');if(p.length===3&&+p[0]===year&&+p[1]===month+1)dated.push({day:+p[2],title:it.txt||it.title||'(无标题)',icon:mod.icon,id:it.id})}})});
  const days=[];for(let i=0;i<fd;i++)days.push(0);for(let i=1;i<=dim;i++)days.push(i);
  let h=`<div class="cal"><div class="cal-head"><button onclick="_calMonth--;if(_calMonth<0){_calMonth=11;_calYear--};renderContent()">‹</button><h3>${year}年${month+1}月</h3><button onclick="_calMonth++;if(_calMonth>11){_calMonth=0;_calYear++};renderContent()">›</button></div><div class="cal-grid">${wk.map(w=>`<div class="cal-wday">${w}</div>`).join('')}`;
  days.forEach(d=>{if(d===0){h+='<div class="cal-cell other"></div>';return}
    const isT=d===now.getDate()&&month===now.getMonth()&&year===now.getFullYear();
    const n=dated.filter(x=>x.day===d).length;
    h+=`<div class="cal-cell${isT?' today':''}" onclick="showCalInfo(${d})"><span class="cal-num">${d}</span>${n?`<span class="cal-dot"></span>`:''}</div>`});
  h+=`</div><div id="calInfo" class="cal-info">📌 ${dated.length}条记录</div></div>`;
  return h;
}
function showCalInfo(d){const el=document.getElementById('calInfo');if(!el)return;const items=[];['diary','tasks','todos'].forEach(mid=>{const mod=state.modules[mid];if(!mod||!mod.items)return;mod.items.forEach(it=>{const dt=it.date||it.due||it.createdAt||'';const p=dt.split('-');if(p.length===3&&+p[2]===d&&+p[1]===_calMonth+1&&+p[0]===_calYear)items.push({icon:mod.icon,title:it.txt||it.title||'(无标题)',id:it.id})})});if(!items.length){el.innerHTML='📌 当天无记录';return}
  el.innerHTML='<b>'+_calYear+'/'+String(_calMonth+1).padStart(2,'0')+'/'+String(d).padStart(2,'0')+'</b>：'+items.map(i=>`<span style="cursor:pointer;color:var(--accent);margin-right:8px" onclick="switchMod('${getItemModule(i.id)}');openDetail('${i.id}')">${i.icon} ${esc(i.title)}</span>`).join('')}
function getItemModule(id){for(const mid of state.moduleOrder){const m=state.modules[mid];if(m&&m.items&&m.items.some(x=>x.id===id))return mid}return'dashboard'}

/* 设置与存储 */
let _useIDB=false;
const _idb={open(){return new Promise((res,rej)=>{const r=indexedDB.open('PhData',1);r.onupgradeneeded=e=>{e.target.result.createObjectStore('kv',{keyPath:'k'})};r.onsuccess=e=>res(e.target.result);r.onerror=e=>rej(e.target.error)})},async get(k){const db=await _idb.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result?t.result.v:null);t.onerror=()=>rej(t.error)})},async set(k,v){const db=await _idb.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite').objectStore('kv').put({k,v});t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})},async remove(k){const db=await _idb.open();return new Promise((res,rej)=>{db.transaction('kv','readwrite').objectStore('kv').delete(k);res()})},async estimate(){const db=await _idb.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readonly').objectStore('kv').getAll();t.onsuccess=()=>res(new Blob(t.result.map(x=>JSON.stringify(x.v))).size);t.onerror=()=>rej(0)})}};
let _customFileHandle=null;
function openSettings(){
  document.getElementById('modalTitle').textContent='⚙️ 设置';
  const mode=_useIDB?'IndexedDB':'localStorage';
  const canFA=!!window.showSaveFilePicker;
  const curTheme=localStorage.getItem('ph_theme_color')||'default';
  document.getElementById('modalBody').innerHTML=`
<div class="field"><label>存储引擎</label><select id="s_backend"><option value="local" ${_useIDB?'':'selected'}>localStorage（默认，兼容性好）</option><option value="idb" ${_useIDB?'selected':''}>IndexedDB（支持大文件）</option></select><div style="font-size:11px;color:var(--ink-faint);margin-top:4px">当前使用：${mode} ｜ ${canFA?'✅ 支持文件系统':'⚠️ 当前浏览器不支持自定义文件位置'}</div><div style="font-size:11px;color:var(--green);margin-top:2px">📌 数据始终存储在本地手机中，以下「导出」仅为备份副本</div></div>
<div class="field"><label>🎨 主题</label><select id="s_theme"><option value="default" ${curTheme==='default'?'selected':''}>深蓝（默认）</option><option value="green" ${curTheme==='green'?'selected':''}>森林绿</option><option value="orange" ${curTheme==='orange'?'selected':''}>暖橙</option><option value="purple" ${curTheme==='purple'?'selected':''}>薰衣草紫</option><option value="pink" ${curTheme==='pink'?'selected':''}>玫瑰粉</option></select></div>
<div class="field"><label>存储用量</label><div id="s_storageInfo" style="font-size:13px;color:var(--ink-soft)">计算中…</div></div>
<div class="field" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" onclick="migrateStorage()" style="flex:1">🔄 迁移数据</button><button class="btn ghost" onclick="pickExportFile()" style="flex:1">${canFA?'📁 选择自动备份位置':'⬇️ 导出备份'}</button></div>
${_customFileHandle?`<div style="font-size:11px;color:var(--green);padding:6px 0">✅ 已设置自动备份文件：每次保存自动同步</div>`:canFA?'':'<div style="font-size:11px;color:var(--ink-faint);padding:6px 0">💡 点击「导出备份」下载当前数据的 JSON 副本</div>'}
<div style="padding:12px 0 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-faint);line-height:1.7">💡 <b>存储位置说明</b>：数据存储在手机本地（localStorage/IndexedDB），导出备份只是副本。<br>💡 <b>迁移数据</b>：在 localStorage 和 IndexedDB 之间转移已有数据。</div>
<hr style="border:none;border-top:1px solid var(--line);margin:14px 0">
<div class="field"><label>☁️ GitHub Gist 同步</label><input id="s_gistToken" placeholder="GitHub Token（需勾选 gist 权限）" value="${esc(localStorage.getItem('ph_gist_token')||'')}" style="margin-bottom:6px"><div style="font-size:11px;color:var(--ink-faint);margin-top:4px">1️⃣ 输入 Token → 点「测试」验证 → 点「上传」创建备份<br>2️⃣ 另一设备输入同 Token → 点「查找」自动找回</div></div>
<div class="field" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" onclick="gistSave()" style="flex:1">☁️ 上传</button><button class="btn ghost" onclick="gistFind()" style="flex:1">🔍 查找</button><button class="btn ghost" onclick="gistTest()" style="flex:1">🔌 测试</button><button class="btn ghost" onclick="checkUpdate()" style="flex:1">🔄 检查更新</button></div>
<div id="s_gistStatus" style="font-size:11px;color:var(--ink-faint);padding:4px 0"></div>
`;
  document.getElementById('modeHint').textContent='';
  document.getElementById('modalSave').onclick=saveSettings;
  document.getElementById('mask').classList.add('show');
  _idb.estimate().then(s=>{const el=document.getElementById('s_storageInfo');if(el){const ls=new Blob([localStorage.getItem(KEY)||'']).size;const idbS=(s/1024).toFixed(1);el.innerHTML='<div>localStorage：'+(ls/1024).toFixed(1)+'KB ｜ IndexedDB：'+idbS+'KB</div>'}}).catch(()=>{});
}
function saveSettings(){const v=document.getElementById('s_backend').value;if((v==='idb')!==_useIDB){_useIDB=v==='idb';localStorage.setItem('ph_use_idb',_useIDB?'1':'');toast('已切换存储引擎，点击「迁移数据」搬移现有数据')}
  const tk=document.getElementById('s_gistToken');if(tk){localStorage.setItem('ph_gist_token',tk.value.trim())}
  const th=document.getElementById('s_theme');if(th){localStorage.setItem('ph_theme_color',th.value);applyTheme(th.value)}
closeModal()}
/* Gist 同步 */
let _gistCache=null;
function gistApi(path,method,body){// 先保存输入框中的 Token
  const inp=document.getElementById('s_gistToken');if(inp&&inp.value.trim())localStorage.setItem('ph_gist_token',inp.value.trim());
  const token=localStorage.getItem('ph_gist_token');if(!token){const s=document.getElementById('s_gistStatus');if(s)s.textContent='❌ 请先输入 GitHub Token';return Promise.reject()}
  return fetch('https://api.github.com'+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):null}).then(r=>{if(r.status===401)throw new Error('Token 无效或过期，请重新生成（Fine-grained Token 需设置 Gists → Read and write）');if(r.status===403)throw new Error('Token 权限不足（Fine-grained Token 需设置 Gists → Read and write）');if(r.status===404)throw new Error('Gist 不存在');if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function gistTest(){const el=document.getElementById('s_gistStatus');if(!el)return;el.textContent='⏳ 验证中...';const inp=document.getElementById('s_gistToken');if(inp&&inp.value.trim())localStorage.setItem('ph_gist_token',inp.value.trim());const token=localStorage.getItem('ph_gist_token');if(!token){el.textContent='❌ 请先输入 Token';return}fetch('https://api.github.com/user',{headers:{Authorization:'Bearer '+token,'Accept':'application/vnd.github.v3+json'}}).then(r=>{if(r.ok)r.json().then(u=>{el.innerHTML='✅ Token 有效 — 用户：'+u.login+'<br>限额剩余：'+r.headers.get('X-RateLimit-Remaining')+'/'+r.headers.get('X-RateLimit-Limit')}).catch(()=>{el.textContent='✅ Token 有效'});else if(r.status===401)el.innerHTML='❌ Token 无效或已过期，请重新生成<br>👉 生成地址：<a href=\"https://github.com/settings/tokens\" target=\"_blank\" style=\"color:var(--accent)\">github.com/settings/tokens</a><br>创建时勾选「Gists」权限 → Read and write';else el.textContent='❌ '+r.status}).catch(e=>{el.textContent='❌ 连接失败：'+e.message})}
function gistSave(){const el=document.getElementById('s_gistStatus');if(!el)return;el.textContent='⏳ 上传中...';const data=JSON.stringify(state,null,2);const gistId=localStorage.getItem('ph_gist_id');const body=gistId?{files:{'hub-data.json':{content:data}}}:{description:'Personal Hub Backup',public:false,files:{'hub-data.json':{content:data}}};(gistId?gistApi('/gists/'+gistId,'PATCH',body):gistApi('/gists','POST',body)).then(r=>{if(!gistId&&r.id){localStorage.setItem('ph_gist_id',r.id)}el.textContent='✅ 已同步';toast('☁️ 已同步到 GitHub Gist')}).catch(e=>{el.textContent='❌ '+e.message})}
function gistLoad(){const el=document.getElementById('s_gistStatus');if(!el)return;const id=localStorage.getItem('ph_gist_id');if(!id){el.textContent='❌ 无 Gist ID';return}el.textContent='⏳ 下载中...';gistApi('/gists/'+id,'GET').then(r=>{if(r&&r.files&&r.files['hub-data.json']){const c=JSON.parse(r.files['hub-data.json'].content);if(c&&c.modules){state=c;save();renderNav();renderContent();el.textContent='✅ 已恢复'}else el.textContent='❌ 数据格式错误'}else el.textContent='❌ 未找到数据'}).catch(e=>{el.textContent='❌ '+e.message})}
function gistFind(){const el=document.getElementById('s_gistStatus');if(!el)return;el.textContent='⏳ 查找中...';gistApi('/gists?per_page=50','GET').then(list=>{const match=list.find(g=>g.files&&g.files['hub-data.json']);if(match){localStorage.setItem('ph_gist_id',match.id);el.textContent='✅ 找到备份 Gist：'+match.id;toast('✅ 找到备份，正在下载...');gistLoad()}else{el.textContent='❌ 未找到备份 Gist，请先在其他设备上传'}}).catch(e=>{el.textContent='❌ '+e.message})}
function checkUpdate(){const el=document.getElementById('s_gistStatus');if(!el)return;el.textContent='⏳ 检查更新...';fetch('https://raw.githubusercontent.com/'+APP_REPO+'/gh-pages/version.json').then(r=>r.json()).then(v=>{if(v.version>APP_VERSION){el.innerHTML='✅ 发现新版本 '+v.version+'（当前 '+APP_VERSION+'）<br><a href="https://github.com/'+APP_REPO+'/releases" target="_blank" style="color:var(--accent)">点此查看更新</a> | 刷新页面即可应用';toast('🔄 新版本 '+v.version+' 可用，请刷新页面')}else{el.textContent='✅ 已是最新版 '+APP_VERSION;toast('✅ 已是最新版')}}).catch(e=>{el.textContent='❌ 检查失败：'+e.message})}
/* 批量选择 */
let batchMode=false,batchSelected=[];
document.addEventListener('click',e=>{if(batchMode){const card=e.target.closest('.card');if(card){const id=card.dataset.id;if(id){const idx=batchSelected.indexOf(id);if(idx>=0)batchSelected.splice(idx,1);else batchSelected.push(id);card.classList.toggle('batch-sel',idx<0);toast('已选 '+batchSelected.length+' 项')}}}});
function toggleBatchMode(){batchMode=!batchMode;if(!batchMode){batchSelected=[];document.querySelectorAll('.card.batch-sel').forEach(c=>c.classList.remove('batch-sel'))}document.querySelectorAll('.card').forEach(c=>c.classList.toggle('batch-mode',batchMode));toast(batchMode?'🔲 点击卡片选择 | d=删除选中 | Esc=退出':'')}
function migrateStorage(){const to=_useIDB?'IndexedDB':'localStorage';const from=_useIDB?'localStorage':'IndexedDB';if(!confirm(`将数据从 ${from} 迁移到 ${to}？将覆盖目标中的现有数据。确定？`))return;const p=_useIDB?Promise.resolve(localStorage.setItem(KEY,JSON.stringify(state))).then(()=>_idb.remove(KEY)):_idb.set(KEY,JSON.stringify(state)).then(()=>localStorage.removeItem(KEY));p.then(()=>toast('数据已迁移到 '+to)).catch(e=>toast('迁移失败：'+e.message))}
async function pickExportFile(){const canFA=!!window.showSaveFilePicker;if(canFA){try{_customFileHandle=await window.showSaveFilePicker({suggestedName:'workbench_backup.json',types:[{description:'JSON Backup',accept:{'application/json':['.json']}}]});localStorage.setItem('ph_file_handle',JSON.stringify({name:_customFileHandle.name}));toast('✅ 已选择备份文件');openSettings()}catch(e){}}else{exportData()}}
// 初始化存储后端
(function(){_useIDB=localStorage.getItem('ph_use_idb')==='1';try{const h=localStorage.getItem('ph_file_handle');if(h)_customFileHandle={name:JSON.parse(h).name}}catch(e){}}());

/* 全局搜索 */
let _savedScrollY=0;
function openSearch(){document.getElementById('searchOverlay').classList.add('show');setTimeout(()=>{const inp=document.getElementById('searchInput');inp.value='';inp.focus();performSearch()},100)}
function closeSearch(){document.getElementById('searchOverlay').classList.remove('show')}
function performSearch(){const q=document.getElementById('searchInput').value.toLowerCase().trim();const el=document.getElementById('searchResults');if(!q){el.innerHTML='<div class="sr-empty">输入关键词搜索所有模块内容</div>';return}
  const results=[];state.moduleOrder.filter(mid=>mid!=='dashboard').forEach(mid=>{const m=state.modules[mid];if(!m||!m.items)return;(m.items||[]).forEach(item=>{
    const fields=[item.txt,item.title,item.name,item.content,item.summary,item.note,item.feeling,item.author,item.info];let match=fields.some(f=>f&&f.toLowerCase().includes(q));if(!match&&item.tags)match=item.tags.some(t=>t.toLowerCase().includes(q));if(match)results.push({mid,name:m.name,icon:m.icon,color:m.color,item})})});
  results.sort((a,b)=>(a.item.done||0)-(b.item.done||0));
  if(!results.length){el.innerHTML='<div class="sr-empty">😕 没有找到匹配的内容</div>';return}
  el.innerHTML=results.slice(0,30).map(r=>{
    const title=esc(r.item.txt||r.item.title||r.item.name||r.item.content||'(无标题)');
    const sub=esc(r.item.author||r.item.info||r.item.date||r.item.createdAt||r.name);
    return `<div class="sr-item" onclick="closeSearch();switchMod('${r.mid}');${r.item.id?`openDetail('${r.item.id}')`:''}"><span class="sr-icon ico ${r.color||'c1'}">${r.icon}</span><div class="sr-info"><div class="sr-title">${title.slice(0,60)}</div><div class="sr-meta">${sub.slice(0,50)}</div></div><span class="sr-badge">${esc(r.name)}</span></div>`
  }).join('')}
document.getElementById('searchOverlay').addEventListener('click',e=>{if(e.target.id==='searchOverlay')closeSearch()});
document.getElementById('searchInput').addEventListener('input',debounce(performSearch,150));
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();if(e.key==='Enter'){const first=document.querySelector('.sr-item');if(first)first.click()}});

function init(){renderNav();renderContent();updateClock();setInterval(updateClock,1000);updateStorageInfo();window.addEventListener('resize',debounce(()=>{if(document.querySelector('.mask.show'))resizeHandwrite();},200));
  // 生成 PNG 图标（SVG 降级方案）
  setTimeout(()=>{if(!document.querySelector('link[rel=\"icon\"][type=\"image/png\"]')){const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,64,64);g.addColorStop(0,'#2383e2');g.addColorStop(.5,'#6940a5');g.addColorStop(1,'#d9730d');x.fillStyle=g;x.beginPath();x.roundRect(8,8,48,48,10);x.fill();x.fillStyle='#fff';x.font='30px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('✦',32,34);const url=c.toDataURL('image/png');const link=document.createElement('link');link.rel='icon';link.type='image/png';link.href=url;document.head.appendChild(link)}},500);
  // 异步加载 IndexedDB 数据（如果设置了）
  if(_useIDB){_idb.get(KEY).then(d=>{if(d){try{const s=JSON.parse(d);if(s&&s.modules){state=s;save();renderNav();renderContent()}}catch(e){}}}).catch(()=>{})}
  // 模态框自动聚焦
  const maskEl=document.getElementById('mask');new MutationObserver(()=>{if(maskEl.classList.contains('show'))setTimeout(()=>{const inp=maskEl.querySelector('input,textarea');if(inp)inp.focus()},120)}).observe(maskEl,{attributes:true,attributeFilter:['class']});
  // 全局快捷键
  let gKey=false;
  document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    if(e.key==='Escape'){if(document.getElementById('mask').classList.contains('show')){closeModal();document.getElementById('hwOverlay').classList.remove('show')}else{document.querySelector('.sidebar.open')&&document.querySelector('.sidebar').classList.remove('open')}return}
    if(!document.getElementById('mask').classList.contains('show')){
      if(e.key==='n'||e.key==='N'){document.getElementById('fab').click()}
      else if((e.key==='/'||(e.key==='k'&&(e.ctrlKey||e.metaKey)))&&!document.getElementById('searchOverlay').classList.contains('show')){e.preventDefault();openSearch()}
      else if(e.key==='g'&&!gKey){gKey=true;setTimeout(()=>gKey=false,800);e.preventDefault();toast('按数字键跳转模块')}
      else if(gKey&&/^[1-9]$/.test(e.key)){const order=state.moduleOrder;const idx=parseInt(e.key)-1;if(idx<order.length)switchMod(order[idx]);gKey=false}
      else if(e.key==='b'||e.key==='B'){toggleBatchMode()}
      else if(e.key==='d'&&batchMode){batchDelete()}
      else if(e.key==='h'||e.key==='H'){if(currentMod!=='dashboard')switchMod('dashboard')}
      else if(e.key==='?'){toast('⌨️ n=新增  g+数字=跳转模块  /=搜索  b=批量选择  h=首页  Esc=关闭')}
    }
  });
  // FAB 提示
  const fab=document.getElementById('fab');const tip=document.getElementById('fabTip');
  if(fab&&tip){fab.addEventListener('mouseenter',()=>tip.classList.add('show'));fab.addEventListener('mouseleave',()=>tip.classList.remove('show'))}
  // 主题恢复
  const savedTheme=localStorage.getItem('ph_theme_mode');if(savedTheme==='dark')document.documentElement.classList.add('dark');
  applyTheme(localStorage.getItem('ph_theme_color')||'default');
  updateThemeBtn();
}
function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem('ph_theme_mode',document.documentElement.classList.contains('dark')?'dark':'light');updateThemeBtn()}
function updateThemeBtn(){const btn=document.getElementById('themeToggle');if(btn)btn.textContent=document.documentElement.classList.contains('dark')?'☀️':'🌙'}
function applyTheme(t){['default','green','orange','purple','pink'].forEach(th=>document.documentElement.classList.remove('theme-'+th));if(t)document.documentElement.classList.add('theme-'+(t==='default'?'default':t))}
init();
</script>
